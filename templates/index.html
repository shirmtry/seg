<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voice to Text + Dịch tự động</title>
<style>
  :root{
    --bg-1:#eef2ff; --bg-2:#fdf2f8; --bg-3:#ecfeff;
    --card:#ffffff;
    --text:#0f172a; --muted:#64748b;
    --accent:#6366f1; --accent-2:#8b5cf6;
    --rec:#ef4444;
    --good:#059669; --warn:#d97706; --info:#2563eb;
    --border:#e5e7eb;
    --shadow-sm:0 1px 2px rgba(0,0,0,.04);
    --shadow-md:0 4px 12px rgba(0,0,0,.05);
    --shadow-lg:0 10px 40px rgba(99,102,241,.15);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    background:
      radial-gradient(1200px 600px at 10% -10%, var(--bg-1), transparent 60%),
      radial-gradient(1000px 500px at 90% 0%, var(--bg-2), transparent 55%),
      radial-gradient(900px 500px at 50% 100%, var(--bg-3), transparent 55%),
      #f8fafc;
    color:var(--text);
    min-height:100vh;
    padding:40px 20px;
    display:flex;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .app{width:100%;max-width:900px}

  /* HEADER */
  .header{text-align:center;margin-bottom:36px}
  .header .logo{
    width:64px;height:64px;margin:0 auto 16px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    border-radius:18px;display:grid;place-items:center;
    box-shadow:0 8px 24px rgba(99,102,241,.35);
    font-size:30px;
  }
  .header h1{
    font-size:28px;font-weight:700;letter-spacing:-0.02em;
    background:linear-gradient(135deg,#4f46e5,#9333ea);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;
    margin-bottom:8px;
  }
  .header .sub{color:var(--muted);font-size:14px;font-weight:500}

  /* MIC */
  .mic-section{display:flex;flex-direction:column;align-items:center;gap:16px;margin-bottom:32px}
  .mic-outer{
    position:relative;width:132px;height:132px;
    display:grid;place-items:center;
  }
  .mic-outer::before{
    content:'';position:absolute;inset:0;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    opacity:.15;
    animation:spin 8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .mic{
    position:relative;z-index:1;
    width:104px;height:104px;border-radius:50%;border:none;cursor:pointer;
    background:linear-gradient(145deg,#7c85ff,#4f46e5);
    color:#fff;font-size:38px;
    display:grid;place-items:center;transition:all .25s ease;
    box-shadow:0 12px 32px rgba(99,102,241,.4);
  }
  .mic:hover:not(:disabled){transform:translateY(-3px) scale(1.03);box-shadow:0 16px 40px rgba(99,102,241,.5)}
  .mic:active:not(:disabled){transform:scale(0.97)}
  .mic:disabled{opacity:.5;cursor:wait}
  .mic.rec{
    background:linear-gradient(145deg,#ff6b6b,#dc2626);
    box-shadow:0 0 0 0 rgba(239,68,68,.7);
    animation:pulse 1.5s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(239,68,68,.6)}
    70%{box-shadow:0 0 0 28px rgba(239,68,68,0)}
    100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}
  }

  .status-pill{
    display:inline-flex;align-items:center;gap:8px;
    padding:8px 16px;border-radius:999px;
    background:#fff;border:1px solid var(--border);
    font-size:13px;font-weight:500;color:var(--muted);
    box-shadow:var(--shadow-sm);
    transition:all .2s;
  }
  .status-pill .dot{
    width:8px;height:8px;border-radius:50%;background:#cbd5e1;
  }
  .status-pill.active .dot{background:var(--rec);animation:blink 1s infinite}
  .status-pill.success .dot{background:var(--good)}
  .status-pill.error .dot{background:var(--rec)}
  @keyframes blink{50%{opacity:.3}}

  /* OPTIONS */
  .opts{
    display:flex;gap:20px;justify-content:center;font-size:13px;
    color:var(--muted);margin-bottom:28px;flex-wrap:wrap;
  }
  .opts label{
    display:flex;align-items:center;gap:8px;cursor:pointer;
    padding:8px 14px;border-radius:10px;
    background:#fff;border:1px solid var(--border);
    transition:all .15s;user-select:none;
  }
  .opts label:hover{border-color:#c7d2fe;background:#f5f7ff}
  .opts input[type=checkbox]{
    width:16px;height:16px;accent-color:var(--accent);cursor:pointer;
  }

  /* CARDS */
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px 22px;
    margin-bottom:14px;
    box-shadow:var(--shadow-md);
    transition:all .2s;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
    background:linear-gradient(180deg,#94a3b8,#cbd5e1);
    opacity:0;
    transition:opacity .2s;
  }
  .card.filled::before{opacity:1}
  .card.src.filled::before{background:linear-gradient(180deg,#60a5fa,#3b82f6)}
  .card.trans.filled::before{background:linear-gradient(180deg,#34d399,#059669)}

  .card-head{
    display:flex;justify-content:space-between;align-items:center;
    gap:12px;margin-bottom:12px;
  }
  .card-title{
    display:flex;align-items:center;gap:10px;
    font-size:12px;font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);
  }
  .card-title .icon{
    width:22px;height:22px;border-radius:6px;
    display:grid;place-items:center;font-size:12px;
    background:#f1f5f9;
  }
  .card.src .card-title .icon{background:#dbeafe;color:#1e40af}
  .card.trans .card-title .icon{background:#d1fae5;color:#065f46}

  .badge{
    display:inline-flex;align-items:center;gap:4px;
    font-size:11px;font-weight:600;
    padding:3px 10px;border-radius:999px;
    background:#eef2ff;color:var(--accent);
    margin-left:6px;letter-spacing:0;text-transform:none;
  }
  .card.trans .badge{background:#d1fae5;color:#047857}

  .card p{
    font-size:19px;line-height:1.6;
    word-wrap:break-word;white-space:pre-wrap;
    color:var(--text);font-weight:500;
  }
  .card.trans p{color:#065f46;font-weight:500}
  .card p.empty{color:#cbd5e1;font-style:italic;font-size:16px;font-weight:400}

  .btn-ghost{
    background:#fff;border:1px solid var(--border);
    color:var(--accent);border-radius:9px;
    padding:6px 12px;font-size:12px;font-weight:600;
    cursor:pointer;white-space:nowrap;
    display:inline-flex;align-items:center;gap:5px;
    transition:all .15s;
  }
  .btn-ghost:hover{background:#eef2ff;border-color:#c7d2fe}
  .btn-ghost:active{transform:scale(0.97)}

  /* METRICS */
  .metrics-grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:10px;margin-bottom:14px;
  }
  .metric{
    background:#fff;border:1px solid var(--border);border-radius:14px;
    padding:14px 12px;text-align:center;
    box-shadow:var(--shadow-sm);
    transition:all .15s;
  }
  .metric:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
  .metric .val{
    font-size:22px;font-weight:700;color:var(--text);
    line-height:1.1;letter-spacing:-0.02em;
  }
  .metric .lbl{
    font-size:10px;font-weight:600;color:var(--muted);
    text-transform:uppercase;letter-spacing:.06em;
    margin-top:4px;
  }
  .metric .sub{font-size:10px;color:#94a3b8;margin-top:2px}
  .metric.highlight{background:linear-gradient(135deg,#eef2ff,#f5f3ff);border-color:#c7d2fe}
  .metric.highlight .val{color:var(--accent)}

  /* FEEDBACK */
  .feedback-list{
    display:flex;flex-direction:column;gap:8px;margin-top:14px;
  }
  .fb-item{
    display:flex;align-items:flex-start;gap:10px;
    padding:10px 14px;border-radius:11px;
    font-size:13.5px;line-height:1.5;
    background:#f8fafc;border:1px solid #eef2f7;
  }
  .fb-item .fb-icon{
    flex-shrink:0;width:20px;height:20px;border-radius:50%;
    display:grid;place-items:center;font-size:11px;
    margin-top:1px;
  }
  .fb-item.good{background:#f0fdf4;border-color:#dcfce7;color:#166534}
  .fb-item.good .fb-icon{background:#22c55e;color:#fff}
  .fb-item.warn{background:#fffbeb;border-color:#fef3c7;color:#92400e}
  .fb-item.warn .fb-icon{background:#f59e0b;color:#fff}
  .fb-item.info{background:#eff6ff;border-color:#dbeafe;color:#1e40af}
  .fb-item.info .fb-icon{background:#3b82f6;color:#fff}
  .fb-item.bad{background:#fef2f2;border-color:#fecaca;color:#991b1b}
  .fb-item.bad .fb-icon{background:#ef4444;color:#fff}

  /* HISTORY */
  .history-section{margin-top:24px}
  .history-title{
    font-size:12px;font-weight:600;color:var(--muted);
    text-transform:uppercase;letter-spacing:.08em;
    margin-bottom:12px;padding-left:4px;
  }
  .h-item{
    background:#fff;border:1px solid var(--border);
    border-radius:14px;padding:14px 18px;margin-bottom:10px;
    box-shadow:var(--shadow-sm);
    transition:all .15s;font-size:14px;
  }
  .h-item:hover{box-shadow:var(--shadow-md);transform:translateX(2px)}
  .h-item .meta{
    display:flex;align-items:center;gap:8px;
    font-size:11px;color:var(--muted);font-weight:600;
    margin-bottom:8px;
  }
  .h-item .meta .arrow{color:#cbd5e1}
  .h-item .src{color:#334155;font-weight:500;margin-bottom:4px}
  .h-item .dst{color:#047857;font-weight:600}

  /* UTILS */
  .hidden{display:none!important}
  @media (max-width:640px){
    body{padding:20px 14px}
    .header h1{font-size:22px}
    .mic-outer{width:110px;height:110px}
    .mic{width:88px;height:88px;font-size:32px}
    .card p{font-size:17px}
    .metrics-grid{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="logo">🎙️</div>
    <h1>Voice to Text + Dịch tự động</h1>
    <p class="sub">Nói tiếng Anh → dịch sang tiếng Việt &nbsp;·&nbsp; Nói tiếng Việt → dịch sang tiếng Anh</p>
  </div>

  <!-- MIC -->
  <div class="mic-section">
    <div class="mic-outer">
      <button id="mic" class="mic" title="Bấm để bắt đầu / dừng">🎤</button>
    </div>
    <div id="status" class="status-pill"><span class="dot"></span><span id="statusText">Bấm micro để bắt đầu</span></div>
  </div>

  <!-- OPTIONS -->
  <div class="opts">
    <label><input type="checkbox" id="autoStop" checked> Tự ngắt khi im lặng</label>
    <label><input type="checkbox" id="autoSpeak"> Đọc bản dịch</label>
  </div>

  <!-- TRANSCRIPT CARD -->
  <div id="srcCard" class="card src">
    <div class="card-head">
      <div class="card-title">
        <span class="icon">🎤</span>
        <span>Bạn nói</span>
        <span id="srcBadge" class="badge hidden"></span>
      </div>
      <button class="btn-ghost hidden" id="speakSrc">🔊 Nghe lại</button>
    </div>
    <p id="transcript" class="empty">Chưa có nội dung…</p>
  </div>

  <!-- TRANSLATION CARD -->
  <div id="transCard" class="card trans">
    <div class="card-head">
      <div class="card-title">
        <span class="icon">🌐</span>
        <span>Bản dịch</span>
        <span id="dstBadge" class="badge hidden"></span>
      </div>
      <button class="btn-ghost hidden" id="speakDst">🔊 Nghe</button>
    </div>
    <p id="translation" class="empty">Chưa có bản dịch…</p>
  </div>

  <!-- METRICS -->
  <div id="metricsWrap" class="hidden">
    <div class="metrics-grid" id="metricsGrid"></div>
  </div>

  <!-- FEEDBACK -->
  <div id="feedbackWrap" class="hidden">
    <div class="card">
      <div class="card-head">
        <div class="card-title">
          <span class="icon">💬</span>
          <span>Phân tích & gợi ý</span>
        </div>
      </div>
      <div class="feedback-list" id="feedbackList"></div>
    </div>
  </div>

  <!-- HISTORY -->
  <div class="history-section">
    <div class="history-title">Lịch sử gần đây</div>
    <div id="history"></div>
  </div>

</div>

<script>
const API_URL = '/api/transcribe';

const $ = (id) => document.getElementById(id);
const micBtn = $('mic');
const statusPill = $('status'), statusText = $('statusText');
const transcriptEl = $('transcript'), translationEl = $('translation');
const srcBadge = $('srcBadge'), dstBadge = $('dstBadge');
const speakSrcBtn = $('speakSrc'), speakDstBtn = $('speakDst');
const historyEl = $('history');
const srcCard = $('srcCard'), transCard = $('transCard');
const metricsWrap = $('metricsWrap'), metricsGrid = $('metricsGrid');
const feedbackWrap = $('feedbackWrap'), feedbackList = $('feedbackList');

const LANG_LABEL = { vi: 'Tiếng Việt 🇻🇳', en: 'English 🇺🇸' };

let mediaRecorder = null, chunks = [], stream = null;
let recording = false, busy = false;
let audioCtx = null, analyser = null, rafId = null, lastVoiceAt = 0;

function setStatus(text, cls = '') {
  statusText.textContent = text;
  statusPill.className = 'status-pill' + (cls ? ' ' + cls : '');
}

/* ---------- GHI ÂM ---------- */
async function startRecording() {
  if (busy || recording) return;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
  } catch (e) {
    setStatus('❌ Không truy cập được micro: ' + e.message, 'error');
    return;
  }

  const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4']
    .find(t => MediaRecorder.isTypeSupported(t));

  mediaRecorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  chunks = [];
  mediaRecorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  mediaRecorder.onstop = handleStop;
  mediaRecorder.start(100);

  recording = true;
  micBtn.classList.add('rec');
  micBtn.textContent = '⏹';
  setStatus('🔴 Đang ghi âm… (bấm để dừng)', 'active');

  if ($('autoStop').checked) startSilenceDetection(stream);
}

function stopRecording() {
  if (!recording) return;
  recording = false;
  micBtn.classList.remove('rec');
  micBtn.textContent = '🎤';
  stopSilenceDetection();
  try { mediaRecorder.stop(); } catch {}
  stream?.getTracks().forEach(t => t.stop());
}

function startSilenceDetection(srcStream) {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const src = audioCtx.createMediaStreamSource(srcStream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 512;
  src.connect(analyser);

  const buf = new Uint8Array(analyser.frequencyBinCount);
  lastVoiceAt = Date.now();

  const tick = () => {
    if (!recording) return;
    analyser.getByteFrequencyData(buf);
    let sum = 0;
    for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
    const rms = Math.sqrt(sum / buf.length);

    if (rms > 12) lastVoiceAt = Date.now();
    else if (Date.now() - lastVoiceAt > 1500) { stopRecording(); return; }

    rafId = requestAnimationFrame(tick);
  };
  tick();
}

function stopSilenceDetection() {
  if (rafId) cancelAnimationFrame(rafId), rafId = null;
  if (audioCtx) audioCtx.close().catch(() => {}), audioCtx = null;
  analyser = null;
}

/* ---------- XỬ LÝ ---------- */
async function handleStop() {
  const blob = new Blob(chunks, { type: mediaRecorder.mimeType || 'audio/webm' });
  chunks = [];

  if (blob.size < 2000) {
    setStatus('⚠️ Đoạn ghi quá ngắn, thử lại nhé', 'error');
    return;
  }

  busy = true;
  micBtn.disabled = true;
  setStatus('⏳ Đang nhận dạng & dịch…');

  try {
    const fd = new FormData();
    fd.append('audio', blob, 'audio.webm');

    const res = await fetch(API_URL, { method: 'POST', body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);

    render(data);
    setStatus('✅ Xong — bấm micro để nói tiếp', 'success');
  } catch (e) {
    console.error(e);
    setStatus('❌ Lỗi: ' + e.message, 'error');
  } finally {
    busy = false;
    micBtn.disabled = false;
  }
}

/* ---------- HIỂN THỊ ---------- */
function render(data) {
  if (!data.text) {
    setStatus('Không nhận dạng được giọng nói', 'error');
    return;
  }

  // Transcript
  transcriptEl.textContent = data.text;
  transcriptEl.classList.remove('empty');
  srcCard.classList.add('filled');

  // Translation
  translationEl.textContent = data.translation || '(Không có bản dịch)';
  translationEl.classList.remove('empty');
  transCard.classList.add('filled');

  // Badges
  srcBadge.classList.remove('hidden');
  srcBadge.textContent = LANG_LABEL[data.lang] || data.lang || '?';
  dstBadge.classList.remove('hidden');
  dstBadge.textContent = LANG_LABEL[data.targetLang] || data.targetLang || '?';

  // Speak buttons
  speakSrcBtn.classList.remove('hidden');
  speakDstBtn.classList.remove('hidden');
  speakSrcBtn.onclick = () => speak(data.text, data.lang);
  speakDstBtn.onclick = () => speak(data.translation, data.targetLang);

  // Metrics
  if (data.metrics) {
    metricsWrap.classList.remove('hidden');
    renderMetrics(data.metrics);
  }

  // Feedback
  if (data.feedback && data.feedback.length) {
    feedbackWrap.classList.remove('hidden');
    renderFeedback(data.feedback);
  }

  // Auto speak
  if ($('autoSpeak').checked) speak(data.translation, data.targetLang);

  addHistory(data);
}

function renderMetrics(m) {
  const items = [
    { v: m.wpm, l: 'WPM', s: 'Tốc độ nói', hl: true },
    { v: m.word_count, l: 'Tổng từ', s: 'word count' },
    { v: m.unique_words, l: 'Từ riêng', s: 'vocabulary' },
    { v: m.filler_count, l: 'Từ đệm', s: 'filler words' },
    { v: m.sentence_count, l: 'Câu', s: 'sentences' },
    { v: m.avg_sentence_len, l: 'Từ / câu', s: 'avg length' },
  ];
  metricsGrid.innerHTML = items.map(it => `
    <div class="metric${it.hl ? ' highlight' : ''}">
      <div class="val">${it.v}</div>
      <div class="lbl">${it.l}</div>
      <div class="sub">${it.s}</div>
    </div>
  `).join('');
}

function renderFeedback(list) {
  const icons = { good: '✓', warn: '!', info: 'i', bad: '✕' };
  feedbackList.innerHTML = list.map(f => `
    <div class="fb-item ${f.type}">
      <div class="fb-icon">${icons[f.type] || '•'}</div>
      <div>${escapeHtml(f.text)}</div>
    </div>
  `).join('');
}

function addHistory(data) {
  const el = document.createElement('div');
  el.className = 'h-item';
  el.innerHTML = `
    <div class="meta">
      <span>${LANG_LABEL[data.lang] || ''}</span>
      <span class="arrow">→</span>
      <span>${LANG_LABEL[data.targetLang] || ''}</span>
    </div>
    <div class="src">${escapeHtml(data.text)}</div>
    <div class="dst">${escapeHtml(data.translation || '')}</div>`;
  historyEl.prepend(el);
  while (historyEl.children.length > 15) historyEl.lastChild.remove();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function speak(text, lang) {
  if (!text || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang === 'vi' ? 'vi-VN' : 'en-US';
  u.rate = 1;
  speechSynthesis.speak(u);
}

micBtn.onclick = () => (recording ? stopRecording() : startRecording());
</script>
</body>
</html>
